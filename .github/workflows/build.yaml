name: CM3 package source preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full approved development commit (must match the selected ref)
        required: true
        type: string
      hypothesis:
        description: Specific changed-stage hypothesis (recorded in the cumulative ledger)
        required: true
        type: string
      experimental_image:
        description: Build an EXPERIMENTAL image file after Stage A; no hardware/release authority
        required: true
        type: boolean
        default: false
      public_distribution:
        description: Retain reviewed experimental image with corresponding sources/notices (no release)
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cm3-phase-b-exclusive
  cancel-in-progress: false

jobs:
  packages:
    if: github.repository == 'blockdyor/radxa-cm3-debian-cli'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      HYPOTHESIS: ${{ inputs.hypothesis }}
      EXPERIMENTAL_IMAGE: ${{ inputs.experimental_image }}
    steps:
      - name: Checkout approved fork revision once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Pinned historical configuration parity tests need their baseline.
          persist-credentials: false
      - name: Check revision, lock and local tests
        env:
          PUBLIC_DISTRIBUTION: ${{ inputs.public_distribution }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = refs/heads/dev/cm3-debian-cli
          test "$PUBLIC_DISTRIBUTION" = false || test "$EXPERIMENTAL_IMAGE" = true
          python3 -m unittest discover -s tests/cm3-cli -v
          python3 scripts/cm3-source-preflight.py --check-lock

      - name: Reconcile cumulative package budget before compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cm3-package-budget.py
      - name: Check image budget early without reserving an assembly entry
        if: inputs.experimental_image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cm3-image-budget.py --check-only
      - name: Qualify this ephemeral external runner
        run: |
          set -euo pipefail
          mkdir -p preflight-work/evidence
          {
            printf 'commit=%s\nhypothesis=%s\n' "$EXPECTED_SHA" "$HYPOTHESIS"
            uname -a
            nproc
            free -h
            df -B1 .
            docker version
          } > preflight-work/evidence/runner.txt
          test "$(uname -m)" = x86_64
          test "$(nproc)" -ge 2
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 7000000
          test "$(df --output=avail -B1 . | tail -n 1)" -ge 25769803776
      - name: Source-build and test signed ARM64 package configuration (no image)
        run: |
          set -euo pipefail
          builder="$(jq -er .builder_image project/cm3-cli/source-lock.json)"
          binfmt="$(jq -er .binfmt_image project/cm3-cli/source-lock.json)"
          docker run --privileged --rm "$binfmt" --install arm64
          mkdir -p package-work
          python3 packages/cm3-cli-board-support/build.py \
            --output preflight-work/board-input/cm3-cli-board-support_0.1.0_all.deb \
            --revision "$EXPECTED_SHA" --epoch "$(git show -s --format=%ct HEAD)" \
            --manifest preflight-work/board-manifest.json
          docker run --detach --privileged --platform linux/amd64 \
            --name "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -e GITHUB_ACTIONS=true -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_SHA \
            -e EXPECTED_SHA -e RUNNER_ENVIRONMENT -e EXPERIMENTAL_IMAGE \
            -v "$PWD:/src:ro" -v "$PWD/package-work:/work" \
            "$builder" sleep infinity
          docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            sh /src/scripts/cm3-external-preflight.sh \
            2>&1 | tee preflight-work/source-build.log
      - name: Prepare exact corresponding sources and preserved notices
        if: inputs.experimental_image
        run: docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-image-delivery.py
      - name: Produce authenticated exact-head Stage A evidence
        if: inputs.experimental_image
        run: docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-image-stage-a.py produce
      - name: Reconcile cumulative three-image budget before assembly
        if: inputs.experimental_image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/cm3-image-budget.py
          docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            test ! -e /work/evidence/image-admission.json
          docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            test ! -L /work/evidence/image-admission.json
          docker cp preflight-work/evidence/image-admission.json \
            "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:/work/evidence/image-admission.json"
      - name: Assemble experimental CM3 disk image
        if: inputs.experimental_image
        run: docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-assemble-image.py --workdir /work
      - name: Independently inspect actual image and stage sanitized delivery
        if: inputs.experimental_image
        run: |
          set -euo pipefail
          docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-verify-image.py
      - name: Stage reviewed engineering diagnostics without payloads
        if: inputs.experimental_image && !inputs.public_distribution
        run: docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-publish-image.py --diagnostics
      - name: Stage cleared public payloads
        if: inputs.experimental_image && inputs.public_distribution
        run: |
          docker exec "cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" python3 /src/scripts/cm3-publish-image.py
      - name: Upload reviewed EXPERIMENTAL image and corresponding materials
        if: inputs.experimental_image && inputs.public_distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cm3-EXPERIMENTAL-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: package-work/public-image/
      - name: Retain reviewed engineering diagnostics only
        if: inputs.experimental_image && !inputs.public_distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cm3-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: package-work/public-diagnostics/
      - name: Remove only this run's disposable builder
        if: always()
        run: |
          set -euo pipefail
          name="cm3-builder-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$name" > /dev/null 2>&1; then
            docker container rm --force "$name"
          fi
      - name: Encrypt allowlisted successful compilation for internal recovery
        if: always() && !inputs.experimental_image
        run: python3 scripts/cm3-retain-packages.py --workdir package-work --output preflight-work/cm3-recovery.cms
      - name: Retain encrypted recovery output (no plaintext binaries or keys)
        if: always() && !inputs.experimental_image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cm3-encrypted-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
          path: preflight-work/cm3-recovery.cms
      - name: Retain allowlisted diagnostic evidence only
        if: always() && !inputs.experimental_image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cm3-source-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            preflight-work/evidence/runner.txt
            preflight-work/evidence/package-admission.json
            preflight-work/source-build.log
            package-work/evidence/*.json
            package-work/evidence/*.tsv
            package-work/evidence/*.sources
            package-work/evidence/*InRelease
            package-work/evidence/*.diff
            package-work/evidence/*.config
            package-work/evidence/*.buildinfo
            package-work/evidence/*.changes
            package-work/evidence/tampered-apt-update.txt
            package-work/evidence/target-packages.tsv
            package-work/evidence/target-origins.txt
            package-work/evidence/dkms-status.txt
            package-work/evidence/header-helper-elf.txt
            package-work/evidence/extlinux-fixture.conf

  provenance:
    needs: packages
    if: github.repository == 'blockdyor/radxa-cm3-debian-cli' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev/cm3-debian-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download only this successful run's encrypted repository bundle
        if: '!inputs.experimental_image'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cm3-encrypted-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance-input
      - name: Download only reviewed build-only engineering diagnostics
        if: inputs.experimental_image && !inputs.public_distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cm3-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance-input
      - name: Download reviewed retained experimental delivery
        if: inputs.experimental_image && inputs.public_distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cm3-EXPERIMENTAL-${{ github.sha }}-${{ github.run_id }}
          path: provenance-input
      - name: Attest encrypted bytes without a source checkout or decryption key
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0, transitively pinned
        with:
          subject-path: ${{ inputs.public_distribution && 'provenance-input/delivery-result.json' || inputs.experimental_image && 'provenance-input/engineering-result.json' || 'provenance-input/cm3-recovery.cms' }}
          push-to-registry: false
          show-summary: false
      - name: Verify exact repository workflow source and signer before acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.expected_sha }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SUBJECT: ${{ inputs.public_distribution && 'provenance-input/delivery-result.json' || inputs.experimental_image && 'provenance-input/engineering-result.json' || 'provenance-input/cm3-recovery.cms' }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          policy=(--repo "$GITHUB_REPOSITORY"
            --cert-identity "https://github.com/blockdyor/radxa-cm3-debian-cli/.github/workflows/build.yaml@refs/heads/dev/cm3-debian-cli"
            --signer-digest "$APPROVED_SHA" --source-digest "$APPROVED_SHA"
            --source-ref refs/heads/dev/cm3-debian-cli --deny-self-hosted-runners)
          gh attestation verify "$SUBJECT" "${policy[@]}" \
            --format json > attestation-verification.json
          cp "$SUBJECT" tampered.cms
          printf '\000' | dd of=tampered.cms bs=1 count=1 conv=notrunc status=none
          if gh attestation verify tampered.cms --bundle "$ATTESTATION_BUNDLE" "${policy[@]}" > /dev/null 2>&1; then
            printf 'Tampered subject was accepted\n' >&2
            exit 1
          fi
      - name: Retain public verification and signature bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cm3-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            attestation-verification.json
            ${{ steps.attest.outputs.bundle-path }}
