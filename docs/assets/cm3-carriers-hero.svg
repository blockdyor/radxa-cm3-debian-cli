<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Debian for Radxa CM3 on CM4 IO and CmRat carriers</title>
  <desc id="description">An original conceptual illustration of a Radxa CM3 compute module on a carrier board. Debian 13, ARM64, headless CLI. Experimental beta; physical hardware untested.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1828"/>
      <stop offset="1" stop-color="#102e35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24414c" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234f4d"/>
      <stop offset="1" stop-color="#123139"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#background)" stroke="#284652" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#grid)" opacity="0.35"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="56" y="58" fill="#86d8c1" font-size="14" letter-spacing="3">BLOCKDYOR / EXPERIMENTAL OS</text>
    <text x="52" y="145" fill="#f3f7fa" font-size="66" font-weight="700">Debian.</text>
    <text x="54" y="209" fill="#f3f7fa" font-size="49" font-weight="700">For Radxa CM3.</text>
    <text x="56" y="249" fill="#b7cbd6" font-size="19">Compute Module 3 on CM4 IO-style carriers.</text>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="56" y="281" width="114" height="32" rx="8" fill="#193944" stroke="#355767"/>
      <text x="113" y="302" fill="#e4f3f5">DEBIAN 13</text>
      <rect x="180" y="281" width="90" height="32" rx="8" fill="#193944" stroke="#355767"/>
      <text x="225" y="302" fill="#e4f3f5">ARM64</text>
      <rect x="280" y="281" width="148" height="32" rx="8" fill="#193944" stroke="#355767"/>
      <text x="354" y="302" fill="#e4f3f5">HEADLESS CLI</text>
    </g>
    <text x="56" y="360" fill="#e4f3f5" font-size="17">CmRat by DTV Electronics</text>
    <text x="56" y="388" fill="#9eb5c3" font-size="16">Raspberry Pi CM4 IO Board</text>
    <g>
      <rect x="730" y="69" width="412" height="277" rx="19" fill="#0c202b" stroke="#497180" stroke-width="2"/>
      <circle cx="752" cy="91" r="5" fill="none" stroke="#497180" stroke-width="2"/>
      <circle cx="1120" cy="91" r="5" fill="none" stroke="#497180" stroke-width="2"/>
      <circle cx="752" cy="324" r="5" fill="none" stroke="#497180" stroke-width="2"/>
      <circle cx="1120" cy="324" r="5" fill="none" stroke="#497180" stroke-width="2"/>
      <text x="936" y="105" fill="#b7cbd6" font-size="12" letter-spacing="2" text-anchor="middle">CARRIER BOARD</text>
      <path d="M778 179H800M778 194H800M778 209H800M778 224H800M1068 179H1091M1068 194H1091M1068 209H1091M1068 224H1091" stroke="#497180" stroke-width="3"/>
      <rect x="800" y="130" width="268" height="137" rx="13" fill="url(#module)" stroke="#86d8c1" stroke-width="2"/>
      <text x="934" y="166" fill="#bce9dc" font-size="13" letter-spacing="2" text-anchor="middle">RADXA</text>
      <text x="934" y="213" fill="#f3f7fa" font-size="43" font-weight="700" text-anchor="middle">CM3</text>
      <text x="934" y="245" fill="#bce9dc" font-size="13" text-anchor="middle">RK3566 COMPUTE MODULE</text>
      <text x="936" y="303" fill="#e4f3f5" font-size="21" font-weight="600" text-anchor="middle">CM4 IO / CmRat</text>
    </g>
    <text x="936" y="373" fill="#e2bd7d" font-size="13" letter-spacing="1" text-anchor="middle">BETA / HARDWARE UNTESTED</text>
    <text x="936" y="397" fill="#91aab8" font-size="11" text-anchor="middle">Concept illustration, not a wiring diagram</text>
  </g>
</svg>
